name: Deploy MoLife

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molife-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    # Provider-neutral deployment: credentials remain in repository secrets.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check cloud.js
          node --check service-worker.js
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          test ! -e dalli-config.php
          test ! -e .env

      - name: Build deployment directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _deploy

          rsync -a ./ _deploy/             --exclude '.git/'             --exclude '.github/'             --exclude '_deploy/'             --exclude 'README.md'             --exclude 'DEPLOY.md'             --exclude 'docs/'             --exclude 'schema.sql'             --exclude 'config.example.php'             --exclude 'dalli-config.php'             --exclude '.env'             --exclude '.env.*'

          echo "Files prepared for deployment:"
          find _deploy -maxdepth 3 -type f -printf '%P\n' | sort

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy
        env:
          DEPLOY_FTP_HOST: ${{ secrets.DEPLOY_FTP_HOST }}
          DEPLOY_FTP_USER: ${{ secrets.DEPLOY_FTP_USER }}
          DEPLOY_FTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
          DEPLOY_FTP_PATH: ${{ secrets.DEPLOY_FTP_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_FTP_HOST}" || -z "${DEPLOY_FTP_USER}" || -z "${DEPLOY_FTP_PASSWORD}" ]]; then
            echo "::notice::Automatic deployment is disabled because FTP deployment secrets are not configured."
            exit 0
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_NAME="${REPO_NAME,,}"
          REMOTE_DIR="${DEPLOY_FTP_PATH:-apps/${REPO_NAME}}"

          if [[ -z "${REMOTE_DIR}" || "${REMOTE_DIR}" == "/" || "${REMOTE_DIR}" == "." ]]; then
            echo "::error::Refusing to deploy to an unsafe remote directory."
            exit 1
          fi

          lftp -u "${DEPLOY_FTP_USER}","${DEPLOY_FTP_PASSWORD}" "ftp://${DEPLOY_FTP_HOST}" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set net:max-retries 2;
            set net:timeout 20;
            set net:reconnect-interval-base 5;
            mirror --reverse --delete --verbose --parallel=4 --no-perms _deploy/ ${REMOTE_DIR}/;
            bye;
          "

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### MoLife deployment workflow"
            echo ""
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Transport: FTPS"
            echo "- Private server configuration is not part of the deployment."
          } >> "${GITHUB_STEP_SUMMARY}"
