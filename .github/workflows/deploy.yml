name: Deploy Dalli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dalli-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check cloud.js
          node --check service-worker.js
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          test ! -e dalli-config.php
          test ! -e .env

      - name: Build deployment directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _deploy

          rsync -a ./ _deploy/             --exclude '.git/'             --exclude '.github/'             --exclude '_deploy/'             --exclude 'README.md'             --exclude 'DEPLOY.md'             --exclude 'docs/'             --exclude 'schema.sql'             --exclude 'config.example.php'             --exclude 'dalli-config.php'             --exclude '.env'             --exclude '.env.*'

          echo "Files prepared for deployment:"
          find _deploy -maxdepth 3 -type f -printf '%P\n' | sort

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy
        env:
          DEPLOY_SECRETS_JSON: ${{ toJSON(secrets) }}
        shell: bash
        run: |
          set -euo pipefail

          readarray -t DEPLOY_VALUES < <(
            python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ.get("DEPLOY_SECRETS_JSON", "{}"))

          def unique_value(suffix):
              matches = [str(value) for key, value in data.items() if key.endswith(suffix) and value]
              return matches[0] if len(matches) == 1 else ""

          print(unique_value("_FTP_HOST"))
          print(unique_value("_FTP_USER"))
          print(unique_value("_FTP_PASSWORD"))
          print(unique_value("_FTP_PATH"))
          PY
          )

          DEPLOY_FTP_HOST="${DEPLOY_VALUES[0]:-}"
          DEPLOY_FTP_USER="${DEPLOY_VALUES[1]:-}"
          DEPLOY_FTP_PASSWORD="${DEPLOY_VALUES[2]:-}"
          DEPLOY_FTP_PATH="${DEPLOY_VALUES[3]:-}"

          if [[ -z "${DEPLOY_FTP_HOST}" || -z "${DEPLOY_FTP_USER}" || -z "${DEPLOY_FTP_PASSWORD}" ]]; then
            echo "::notice::Automatic deployment is disabled because exactly one *_FTP_HOST, *_FTP_USER and *_FTP_PASSWORD secret trio was not found."
            exit 0
          fi

          echo "::add-mask::${DEPLOY_FTP_HOST}"
          echo "::add-mask::${DEPLOY_FTP_USER}"
          echo "::add-mask::${DEPLOY_FTP_PASSWORD}"

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_NAME="${REPO_NAME,,}"
          REMOTE_DIR="${DEPLOY_FTP_PATH:-apps/${REPO_NAME}}"

          if [[ -z "${REMOTE_DIR}" || "${REMOTE_DIR}" == "/" || "${REMOTE_DIR}" == "." ]]; then
            echo "::error::Refusing to deploy to an unsafe remote directory."
            exit 1
          fi

          lftp -u "${DEPLOY_FTP_USER}","${DEPLOY_FTP_PASSWORD}" "ftp://${DEPLOY_FTP_HOST}" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set net:max-retries 2;
            set net:timeout 20;
            set net:reconnect-interval-base 5;
            mirror --reverse --delete --verbose --parallel=4 --no-perms _deploy/ ${REMOTE_DIR}/;
            bye;
          "

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Dalli deployment workflow"
            echo ""
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Transport: FTPS"
            echo "- Private server configuration is not part of the deployment."
          } >> "${GITHUB_STEP_SUMMARY}"
